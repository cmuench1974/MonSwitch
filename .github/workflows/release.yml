name: Release

# Jeder Push auf main (z. B. Merge von DEV) erzeugt ein GitHub-Release mit der Version aus
# Directory.Build.props – sofern es diese Version noch nicht gibt.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test MonSwitch.slnx -c Release

      - name: Publish
        shell: pwsh
        run: ./build.ps1 -Zip

      - name: GitHub-Release erstellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText
          $tag = "v$version"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag existiert bereits – für ein neues Release die Version in Directory.Build.props erhöhen."
            exit 0
          }
          gh release create $tag "artifacts/MonSwitch-$version-win-x64.zip" --target $env:GITHUB_SHA --title "MonSwitch $version" --generate-notes
